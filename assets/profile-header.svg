<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Lagrimante — Software Developer</title>
  <desc id="desc">Banner escuro com detalhes verdes e uma janela de código apresentando as tecnologias favoritas de Lucas.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08090B"/>
      <stop offset="0.55" stop-color="#0E1515"/>
      <stop offset="1" stop-color="#10251E"/>
    </linearGradient>
    <linearGradient id="accent" x1="78" y1="100" x2="520" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 72) rotate(135) scale(420 360)">
      <stop stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#6EE7B7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" stroke="#6EE7B7" stroke-opacity="0.22" stroke-width="2"/>

  <g transform="translate(72 74)">
    <rect width="54" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="62" fill="#E7EAF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="750" letter-spacing="-1.5">Lucas Lagrimante</text>
    <text x="1" y="100" fill="#6EE7B7" font-family="JetBrains Mono, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="3">SOFTWARE DEVELOPER</text>
    <text x="0" y="155" fill="#A8B3C4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Produtos úteis. Código sólido. Privacidade por padrão.</text>
    <g transform="translate(0 184)">
      <circle cx="7" cy="7" r="7" fill="#34D399"/>
      <text x="24" y="13" fill="#D8DEE9" font-family="JetBrains Mono, Consolas, monospace" font-size="15">Juiz de Fora · MG · Brasil</text>
    </g>
  </g>

