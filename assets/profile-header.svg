      <text x="143" y="139" fill="#E7EAF0">: [</text>
      <text x="169" y="139" fill="#C3E88D">"React"</text>
      <text x="224" y="139" fill="#E7EAF0">, </text>
      <text x="240" y="139" fill="#C3E88D">"Supabase"</text>
      <text x="319" y="139" fill="#E7EAF0">],</text>

      <text x="24" y="169" fill="#8A94A6">04</text>
      <text x="73" y="169" fill="#82AAFF">cloud</text>
      <text x="117" y="169" fill="#E7EAF0">: [</text>
