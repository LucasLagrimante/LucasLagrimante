      <text x="254" y="169" fill="#C3E88D">"Claude Code"</text>
      <text x="357" y="169" fill="#E7EAF0">],</text>

      <text x="24" y="199" fill="#8A94A6">05</text>
      <text x="73" y="199" fill="#82AAFF">building</text>
      <text x="143" y="199" fill="#E7EAF0">: [</text>
      <text x="169" y="199" fill="#C3E88D">"MinhaGrana"</text>
      <text x="272" y="199" fill="#E7EAF0">, </text>
      <text x="288" y="199" fill="#C3E88D">"sharenote"</text>
      <text x="383" y="199" fill="#E7EAF0">]</text>

      <text x="24" y="229" fill="#8A94A6">06</text>
