<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tecnologias favoritas de Lucas</title>
  <desc id="desc">PHP, PostgreSQL e jQuery em três cards coloridos.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1013"/>
      <stop offset="1" stop-color="#151A1D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="190" rx="18" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="188" rx="17" stroke="#2A343B" stroke-width="2"/>

  <g transform="translate(48 34)" filter="url(#shadow)">
    <rect width="344" height="122" rx="14" fill="#151820" stroke="#777BB4" stroke-opacity="0.75" stroke-width="2"/>
    <rect x="18" y="19" width="80" height="42" rx="21" fill="#777BB4"/>
    <text x="58" y="47" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" font-style="italic">PHP</text>
    <text x="19" y="88" fill="#E7EAF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Aplicações sólidas</text>
    <text x="19" y="108" fill="#8A94A6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Web direta, madura e produtiva</text>
  </g>

  <g transform="translate(428 34)" filter="url(#shadow)">
    <rect width="344" height="122" rx="14" fill="#111A20" stroke="#336791" stroke-opacity="0.9" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#336791"/>
    <text x="40" y="47" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" font-weight="700">P</text>
    <text x="74" y="47" fill="#D8E8F5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">PostgreSQL</text>
    <text x="19" y="88" fill="#E7EAF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Dados consistentes</text>
    <text x="19" y="108" fill="#8A94A6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Consultas poderosas e previsíveis</text>
  </g>

  <g transform="translate(808 34)" filter="url(#shadow)">
    <rect width="344" height="122" rx="14" fill="#101A21" stroke="#0769AD" stroke-opacity="0.9" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#0769AD"/>
    <path d="M27 43C34 52 47 53 55 45M31 35C37 41 46 42 52 37M38 29C42 32 47 32 50 30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="47" fill="#D7ECFA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">jQuery</text>
    <text x="19" y="88" fill="#E7EAF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Interfaces sem excesso</text>
    <text x="19" y="108" fill="#8A94A6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Simples, direto e eficiente</text>
  </g>
</svg>
